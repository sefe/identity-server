name: requirements-backlog
version: 1
settings: { max_stage_iterations: 3, fail_on_schema_error: true, preserve_all_artifacts: true }
stages:
  - id: requirements-analysis
    risk: high
    type: parallel_with_synthesis
    depends_on: []
    agents:
      - { id: requirements-product-analyst, prompt: prompts/sdlc/requirements-product.md, schema: schemas/sdlc/analysis.schema.json, output: product-analysis.json }
      - { id: requirements-risk-analyst, prompt: prompts/sdlc/requirements-risk.md, schema: schemas/sdlc/analysis.schema.json, output: risk-analysis.json }
      - { id: requirements-testability-analyst, prompt: prompts/sdlc/requirements-testability.md, schema: schemas/sdlc/analysis.schema.json, output: testability-analysis.json }
    synthesis: { agent: requirements-synthesis, prompt: prompts/sdlc/synthesis.md, schema: schemas/sdlc/synthesis.schema.json, output: requirements-synthesis.json }
  - id: backlog-planning
    risk: high
    type: sequential
    depends_on: [requirements-analysis]
    agents:
      - { id: backlog-work-item-planner, prompt: prompts/sdlc/work-item-planner.md, schema: schemas/actions/work-item-plan.schema.json, output: work-item-plan.json }
    assurance: { reviewed_by: backlog-review, deterministic_evidence: true }
  - id: backlog-review
    risk: high
    type: parallel_review
    depends_on: [backlog-planning]
    agents:
      - { id: backlog-correctness-reviewer, prompt: prompts/sdlc/review-correctness.md, schema: schemas/sdlc/review.schema.json, output: correctness-review.json }
      - { id: backlog-quality-reviewer, prompt: prompts/sdlc/review-quality.md, schema: schemas/sdlc/review.schema.json, output: quality-review.json }
      - { id: backlog-security-reviewer, prompt: prompts/sdlc/review-security.md, schema: schemas/sdlc/review.schema.json, output: security-review.json }
    approval: { strategy: unanimous, on_reject: { return_to: backlog-planning }, max_iterations: 3 }
  - id: create-backlog-items
    risk: high
    type: deterministic_action
    depends_on: [backlog-review]
    action: { handler: create_work_items, input: work-item-plan.json, output: action-result.json }
    assurance: { approved_by: backlog-review }

  # A backlog nobody implements is a document. Azure DevOps has no trigger for "a work item became
  # ready" - nothing in the repository changes when one is filed - so the run that filed the task
  # starts the pipeline that implements it, naming the task it filed. One run per task, and only for
  # tasks whose hand-off has not already been made: the marker the queue writes onto the item is
  # permanent, so a sweep that files the same task again does not implement it twice.
  - id: queue-backlog-implementation
    risk: high
    type: deterministic_action
    depends_on: [create-backlog-items]
    action:
      handler: queue_pipeline
      pipeline: SDLC Foundry - Implement Work Item
      output: action-result.json
      inputs:
        plan:
          stage: backlog-planning
          artifact: work-item-plan.json
        workItems:
          stage: create-backlog-items
          artifact: action-result.json
    assurance: { approved_by: backlog-review }
