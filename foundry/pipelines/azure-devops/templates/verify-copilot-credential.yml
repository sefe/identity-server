# Fail before the expensive part when the Copilot credential cannot work.
#
# A run that starts without a usable token burns an agent for minutes and then
# fails deep inside a stage, where the real cause is buried under agent output.
# Checking the token first turns that into a one-line failure at the top.
#
# The check has two halves because the two failures are different. A token can
# be a perfectly valid GitHub credential and still be worthless to Copilot, so
# authenticating it against the API proves only half of what matters.
#
# The second half is a real Copilot call. There is no cheaper way: the token
# exchange Copilot clients use answers 404 for a working token and a broken one
# alike, so it cannot tell them apart. A single prompt can, and it is charged as
# one premium request, which is why it runs on the first leg only rather than on
# all twelve.

parameters:
  - name: legIndex
    type: number
    default: 1

steps:
  - bash: |
      set -uo pipefail
      TOKEN="$(printf '%s' "${COPILOT_TOKEN:-}" | tr -d '[:space:]')"
      if [ -z "$TOKEN" ]; then
        echo "##[error]COPILOT_GITHUB_TOKEN is empty. Add it as a secret variable in the 'sdlc-foundry-secrets' variable group and make sure the group is linked to this pipeline."
        exit 1
      fi
      case "$TOKEN" in
        github_pat_*) KIND="fine-grained PAT" ;;
        ghp_*)        KIND="classic PAT" ;;
        gho_*|ghu_*)  KIND="OAuth token" ;;
        *)            KIND="unrecognised format" ;;
      esac
      echo "Token format: $KIND"
      if [ "$KIND" = "classic PAT" ]; then
        echo "##[error]This is a classic PAT (ghp_...). GitHub Copilot CLI requires a fine-grained personal access token (github_pat_...) with the account-level 'Copilot Requests' permission. Classic tokens are rejected regardless of the scopes granted to them."
        exit 1
      fi
      STATUS=$(curl -sS -o /tmp/gh-user.json -w '%{http_code}' \
        --connect-timeout 15 --max-time 60 \
        -H "Authorization: Bearer $TOKEN" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/user || true)
      STATUS="${STATUS: -3}"
      if [ -z "$STATUS" ]; then STATUS="000"; fi
      if [ "$STATUS" != "200" ]; then
        if [ "$STATUS" = "000" ]; then
          echo "##[error]Could not reach api.github.com. The token was not verified because of a network or proxy problem on the agent."
          exit 1
        fi
        echo "##[error]GitHub rejected the token (HTTP $STATUS). It is invalid, expired, or revoked."
        if [ "$KIND" = "unrecognised format" ]; then
          echo "##[error]The value does not look like a GitHub token at all. Check that the variable group secret holds the token itself and not a placeholder."
        fi
        if [ "$STATUS" = "403" ]; then
          echo "##[error]HTTP 403 usually means the organisation requires SSO authorisation for this token. Authorise it for the organisation on the GitHub token settings page."
        fi
        exit 1
      fi
      LOGIN=$(sed -n 's/.*"login"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/gh-user.json | head -n 1)
      echo "Token authenticates as GitHub user: ${LOGIN:-unknown}"
      echo "The token is a valid GitHub credential. Whether Copilot accepts it is proved separately."
    displayName: Verify Copilot credential before running agents
    timeoutInMinutes: 3
    env:
      COPILOT_TOKEN: $(COPILOT_GITHUB_TOKEN)

  - ${{ if eq(parameters.legIndex, 1) }}:
      - bash: |
          set -uo pipefail
          OUTPUT=$(copilot -p "Reply with the single word OK and nothing else." --allow-all-tools 2>&1)
          CODE=$?
          if [ $CODE -eq 0 ]; then
            echo "Copilot answered. The credential works end to end."
            exit 0
          fi
          # Only the two faults below are worth stopping twelve legs for. Anything
          # else at this point is more likely a hiccup in a check that is not the
          # job itself, and the stages retry their own calls.
          if printf '%s' "$OUTPUT" | grep -qi "authentication failed\|bad credentials"; then
            echo "##[error]GitHub accepts this token, but Copilot refuses it. Every agent would fail on its first call, so the run stops here instead of discovering this twelve legs deep."
            echo "##[error]Open the token at https://github.com/settings/personal-access-tokens and check two things:"
            echo "##[error]  1. Resource owner must be your own user account. A token owned by an organisation is never offered the Copilot permission at all, so it looks valid everywhere else and fails only here."
            echo "##[error]  2. Under 'Account permissions' - not 'Repository permissions' - set 'Copilot Requests' to Read-only."
            echo "##[error]If both are already correct, the account has no Copilot licence."
            exit 1
          fi
          if printf '%s' "$OUTPUT" | grep -qi "quota\|rate limit"; then
            echo "##[error]Copilot accepted the credential but refused the request: the account is out of quota. The run stops now, because every stage would fail the same way."
            exit 1
          fi
          echo "##[warning]The Copilot smoke check did not succeed, but the failure looks unrelated to the credential, so the run continues. Output follows."
          printf '%s\n' "$OUTPUT"
        displayName: Confirm Copilot accepts the credential
        timeoutInMinutes: 6
        env:
          COPILOT_GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)
